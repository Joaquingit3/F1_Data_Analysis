<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> F1DataHub - Fórmula 1 analizada con datos en español</title>
    <link rel="icon" href="/imagenes/favicon.png" type="image/png">
    <link rel="stylesheet" href="/css/styles.css">
    <!-- Código de Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({
              google_ad_client: "ca-pub-XXXXXXXXXXXXXXXX",
              enable_page_level_ads: true
         });
    </script>

    <style>
        .layout-begining {
            width: 80%;
            margin: 0 auto;
        }

        .layout-begining .title-container{
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .layout-begining {
                padding: 0 1rem;
            }

            .layout-begining .title-container{
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Header Dinámico -->
    <div id="header">
    <script>
        fetch('/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;

                const headerElement = document.querySelector('header'); // Selector del header ya cargado

                // Este es el código que gestiona la clase 'hidden'
                let lastScrollTop = 0;

                window.addEventListener('scroll', function() {
                    const currentScrollTop = window.pageYOffset || document.documentElement.scrollTop;

                    if (currentScrollTop > lastScrollTop) {
                        // El usuario hace scroll hacia abajo, ocultar la cabecera
                        headerElement.classList.add('hidden');
                    } else {
                        // El usuario hace scroll hacia arriba, mostrar la cabecera
                        headerElement.classList.remove('hidden');
                    }

                    lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop; // Evita valores negativos
                });
            });
    </script>
    </div>

    <main class="main-content">
        <section class="articles-list">
            <ul style="padding: 0;">
                <div class="layout-begining">
                    <!-- Título -->
                    <div class="title-container">
                        <h2 class="main-title"> <span>Artículos Recientes {{nombre}}</span></h2>
                    </div>
                    <div class="content-container-tables">
                        {% for fila in filas_articulos%}
                        <article class="article-card">
                            <a href="{{grand_prix}}/{{fila.document}}">
                                <img src="{{grand_prix}}/imagenes/{{fila.sesion}}/Imagen_principal_{{fila.sesion}}.png" alt="Imagen de la {{fila.sesion}}">
                                 <div class="article-content">
                                    <h2></h2>
                                    <div class="article-meta">
                                        <span class="category" style="color:{{race_color[0]}}">{{category}}</span>
                                        <span class="date"></span>
                                    </div>
                                </div>
                            </a>
                        </article>
                        {% endfor %}
                    </div>
                </div>
            </ul>
        </section>

        <!-- Espacio para Anuncio -->
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="XXXXXXXXXX"
             data-ad-format="auto"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </main>

    <div id="footer">
    <script>
        fetch('/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });
    </script>
    </div>
</body>
</html>
